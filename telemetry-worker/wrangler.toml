name = "recording-extension-telemetry"
main = "src/index.ts"
compatibility_date = "2026-08-15"

[observability]
enabled = true
head_sampling_rate = 0.1

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "recording-extension-telemetry"
database_id = "247543ef-795a-4fd5-975d-0c098a3904b9"
migrations_dir = "migrations"

[[ratelimits]]
name = "TELEMETRY_RATE_LIMITER"
namespace_id = "20260816"
simple = { limit = 30, period = 60 }

[triggers]
crons = ["17 3 * * *"]

[vars]
# Comma-separated exact extension origins. Add every store-assigned ID before deploy.
ALLOWED_EXTENSION_ORIGINS = "chrome-extension://kiineaoggnikfpcicndeocnbmaeediom"
