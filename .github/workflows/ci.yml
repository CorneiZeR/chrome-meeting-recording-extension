# Continuous integration: the same gates a release runs, on every push and PR,
# so a release button press can never be the first time the tree is checked.
#
# Performance is deliberately *not* gated here. The perf budgets (A/V marker
# drift, freeze and silence windows) are calibrated against real hardware, and a
# shared 2-vCPU runner encoding 1080p30 in software misses them: the tier ran as
# an informational job for a while and was red on three runs out of four, which
# is worse than not running it — a permanently red job is one nobody reads.
# A performance verdict comes from `npm run test:e2e:perf` on a calibrated
# machine; the tiers stay available as npm scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run test:unit

  e2e:
    name: E2E (mocked capture & Drive)
    runs-on: ubuntu-latest
    # A headed browser under xvfb can hang instead of failing; without a bound
    # that spends hours of runner time saying nothing.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Not an extra: the functional tier confirms a setting end-to-end in the
      # *encoded* artifact (settings-matrix probes the recorded tab file), so
      # ffprobe is part of the E2E environment.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      # Some specs launch a headed browser (extension capture paths need a real
      # window), so the run happens under a virtual display.
      - run: xvfb-run -a npm run test:e2e:functional
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: output/playwright
          retention-days: 7

  build:
    name: Production build (all browser targets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, deliberately. `check:version` compares package.json
          # against the highest release tag and *skips silently* when it cannot
          # read tags — so a shallower clone would risk turning that guard into a
          # no-op that still reports green. The whole repo is 5 MB; the seconds
          # this costs are not worth trading a guard for.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Proves the artifacts a release would publish still build and pass the
      # production guards. Needs no secrets: the OAuth client id it embeds is
      # public and committed, and the extension collects nothing to report.
      - run: npm run release:artifacts
      # The build and its guards are the gate on a pull request; the zips
      # themselves are only worth keeping where someone installs from them —
      # a push to main or a manual dispatch.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: extension-builds-${{ github.sha }}
          path: release/
          retention-days: 14
