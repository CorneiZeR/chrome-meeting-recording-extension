# Continuous integration: the same gates a release runs, on every push and PR,
# so a release button press can never be the first time the tree is checked.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run test:unit

  e2e:
    name: E2E (mocked capture & Drive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The performance specs measure the recorded artifacts with ffprobe, so
      # the media toolchain is part of the E2E environment, not an extra.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
      # Some specs launch a headed browser (extension capture paths need a real
      # window), so the run happens under a virtual display.
      - run: xvfb-run -a npm run test:e2e:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: output/playwright
          retention-days: 7

  build:
    name: Production build (all browser targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Proves the artifacts a release would publish still build and pass the
      # production guards, without needing the real OAuth secrets: only the
      # telemetry endpoint is required at build time.
      - run: npm run release:artifacts
        env:
          TELEMETRY_ENDPOINT: ${{ vars.TELEMETRY_ENDPOINT || 'https://recording-extension-telemetry.kstroevsky.workers.dev/api/telemetry/batches' }}
      - uses: actions/upload-artifact@v4
        with:
          name: extension-builds-${{ github.sha }}
          path: release/
          retention-days: 14
